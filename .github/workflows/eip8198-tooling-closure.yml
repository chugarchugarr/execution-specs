name: EIP-8198 Tooling Closure

on:
  pull_request:

permissions:
  contents: write

jobs:
  closure:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: eip8198-slot-time-agnostic
      - uses: ./.github/actions/setup-uv
      - name: Make fork tooling schedule-aware and prove it
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Fork override matching: a schedule-driven fork exposes its current
          # max blob gas through a function rather than a fixed literal.
          path = Path("src/ethereum_spec_tools/forks.py")
          text = path.read_text()
          old = '''        checks = (
              (
                  self.max_blob_gas_per_block,
                  fork_mod,
                  "MAX_BLOB_GAS_PER_BLOCK",
              ),
          '''
          new = '''        max_blob_gas_per_block = getattr(
              fork_mod, "MAX_BLOB_GAS_PER_BLOCK", None
          )
          if max_blob_gas_per_block is None:
              get_max_blob_gas_per_block = getattr(
                  fork_mod, "get_max_blob_gas_per_block", None
              )
              if get_max_blob_gas_per_block is not None:
                  max_blob_gas_per_block = get_max_blob_gas_per_block(U64(0))
          if (
              self.max_blob_gas_per_block is not None
              and self.max_blob_gas_per_block != max_blob_gas_per_block
          ):
              return False

          checks = (
          '''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          # ForkBuilder must never silently patch compatibility snapshots on a
          # schedule-driven fork; that would produce a clone whose source says
          # one thing while runtime follows SLOT_DURATION_SCHEDULE.
          path = Path("src/ethereum_spec_tools/new_fork/builder.py")
          text = path.read_text()
          marker = '''    def modify_target_blob_gas_per_block(
              self, blob_target_gas_per_block: U64
          ) -> None:
          '''
          helpers = '''    def _uses_slot_duration_schedule(self) -> bool:
              """Return whether the template derives blob limits from slot time."""
              template_path = self.template_fork.path
              return (
                  template_path is not None
                  and (Path(template_path) / "slot_timing.py").is_file()
              )

              def _reject_legacy_blob_override(self, name: str) -> None:
                  """Reject fixed-blob overrides on schedule-driven forks."""
                  if self._uses_slot_duration_schedule():
                      raise ValueError(
                          f"{name} is a legacy fixed-blob override and cannot be "
                          "applied to a SLOT_DURATION_SCHEDULE-driven fork"
                      )

          '''
          assert marker in text
          text = text.replace(marker, helpers + marker, 1)

          replacements = {
              '''        """Append a `CodemodArgs` that sets `BLOB_TARGET_GAS_PER_BLOCK`."""
                  self.modifiers.append(
              ''': '''        """Append a `CodemodArgs` that sets `BLOB_TARGET_GAS_PER_BLOCK`."""
                  self._reject_legacy_blob_override("blob_target_gas_per_block")
                  self.modifiers.append(
              ''',
              '''        """Append a `CodemodArgs` that sets `PER_BLOB`."""
                  self.modifiers.append(
              ''': '''        """Append a `CodemodArgs` that sets `PER_BLOB`."""
                  self._reject_legacy_blob_override("gas_per_blob")
                  self.modifiers.append(
              ''',
              '''        """Append a `CodemodArgs` that sets `BLOB_MIN_GASPRICE`."""
                  self.modifiers.append(
              ''': '''        """Append a `CodemodArgs` that sets `BLOB_MIN_GASPRICE`."""
                  self._reject_legacy_blob_override("blob_min_gasprice")
                  self.modifiers.append(
              ''',
              '''        """Append a `CodemodArgs` that sets `BLOB_BASE_FEE_UPDATE_FRACTION`."""
                  self.modifiers.append(
              ''': '''        """Append a `CodemodArgs` that sets `BLOB_BASE_FEE_UPDATE_FRACTION`."""
                  self._reject_legacy_blob_override(
                      "blob_base_fee_update_fraction"
                  )
                  self.modifiers.append(
              ''',
              '''        """Append a `CodemodArgs` that sets `MAX_BLOB_GAS_PER_BLOCK`."""
                  self.modifiers.append(
              ''': '''        """Append a `CodemodArgs` that sets `MAX_BLOB_GAS_PER_BLOCK`."""
                  self._reject_legacy_blob_override("max_blob_gas_per_block")
                  self.modifiers.append(
              ''',
              '''        """Append a `CodemodArgs` that sets `BLOB_SCHEDULE_TARGET`."""
                  self.modifiers.append(
              ''': '''        """Append a `CodemodArgs` that sets `BLOB_SCHEDULE_TARGET`."""
                  self._reject_legacy_blob_override("blob_schedule_target")
                  self.modifiers.append(
              ''',
              '''        """Append a `CodemodArgs` that sets `BLOB_SCHEDULE_MAX`."""
                  self.modifiers.append(
              ''': '''        """Append a `CodemodArgs` that sets `BLOB_SCHEDULE_MAX`."""
                  self._reject_legacy_blob_override("blob_schedule_max")
                  self.modifiers.append(
              ''',
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new, 1)
          path.write_text(text)

          # Fork-cache tests must derive Amsterdam's dynamic max rather than
          # requiring a fixed MAX_BLOB_GAS_PER_BLOCK constant.
          path = Path("tests/evm_tools/test_fork_cache.py")
          text = path.read_text()
          anchor = '''    defaults: dict[str, U64 | Uint | None] = {
          '''
          derived = '''    max_blob_gas_per_block = getattr(
              fork_mod, "MAX_BLOB_GAS_PER_BLOCK", None
          )
          if max_blob_gas_per_block is None:
              get_max_blob_gas_per_block = getattr(
                  fork_mod, "get_max_blob_gas_per_block", None
              )
              if get_max_blob_gas_per_block is not None:
                  max_blob_gas_per_block = get_max_blob_gas_per_block(U64(0))

          '''
          assert anchor in text
          text = text.replace(anchor, derived + anchor, 1)
          old = '''        "max_blob_gas_per_block": getattr(
                  fork_mod,
                  "MAX_BLOB_GAS_PER_BLOCK",
                  None,
              ),
          '''
          new = '''        "max_blob_gas_per_block": max_blob_gas_per_block,
          '''
          assert old in text
          text = text.replace(old, new, 1)

          append_marker = '''def test_fork_cache_reuses_cached_clone_for_identical_changed_request(
          '''
          rejection_test = '''def test_schedule_driven_clone_rejects_legacy_blob_override() -> None:
              """Never create a clone whose fixed blob aliases lie about runtime."""
              template = _template()
              changed = ForkOverrides(blob_schedule_target=U64(13))
              with pytest.raises(ValueError, match="SLOT_DURATION_SCHEDULE"):
                  Hardfork.clone(template=template, overrides=changed)


          '''
          assert append_marker in text
          text = text.replace(append_marker, rejection_test + append_marker, 1)
          path.write_text(text)

          # New-fork's generic blob override test remains on fixed-blob forks.
          # Schedule-driven forks are copied without fixed blob overrides and
          # explicitly reject those legacy knobs.
          path = Path("tests/evm_tools/test_new_fork.py")
          text = path.read_text()
          start = text.index("@pytest.mark.parametrize(\n")
          end = text.index("\ndef has_module_docstring", start)
          replacement = '''@pytest.mark.parametrize(
              "template_fork",
              [
                  Hardfork.discover()[-1].short_name,
                  "osaka",
              ],
              ids=lambda tf: f"{tf}",
          )
          def test_end_to_end(template_fork: str) -> None:
              """Create forks without imposing fixed blob literals on schedules."""
              with TemporaryDirectory() as base_dir:
                  output_dir = Path(base_dir) / "ethereum"
                  fork_dir = output_dir / "e2e_fork"
                  template_path = Path("src/ethereum/forks") / template_fork
                  uses_slot_duration_schedule = (
                      template_path / "slot_timing.py"
                  ).exists()

                  args = [
                      "--new-fork",
                      "e2e_fork",
                      "--template-fork",
                      template_fork,
                      "--at-timestamp",
                      "7",
                      "--output",
                      str(output_dir),
                  ]
                  if not uses_slot_duration_schedule:
                      args.extend(
                          [
                              "--target-blob-gas-per-block",
                              "199",
                              "--blob-base-fee-update-fraction",
                              "750",
                              "--min-blob-gasprice",
                              "2",
                              "--gas-per-blob",
                              "1",
                              "--max-blob-gas-per-block",
                              "99",
                              "--blob-schedule-target",
                              "88",
                              "--blob-schedule-max",
                              "77",
                          ]
                      )

                  new_fork(args)

                  with (fork_dir / "__init__.py").open("r") as f:
                      source = f.read()
                      assert '\"\"\"' not in source[:20]
                      assert "FORK_CRITERIA: ForkCriteria = ByTimestamp(7)" in source
                      assert template_fork.capitalize() not in source

                  with (fork_dir / "utils" / "hexadecimal.py").open("r") as f:
                      source = f.read()
                      assert "E2E Fork" in source

                  if uses_slot_duration_schedule:
                      with (fork_dir / "slot_timing.py").open("r") as f:
                          source = f.read()
                          assert "SLOT_DURATION_SCHEDULE" in source
                          assert "SlotDurationEntry" in source
                  else:
                      with (fork_dir / "vm" / "gas.py").open("r") as f:
                          source = f.read()
                          expected = [
                              "BLOB_TARGET_GAS_PER_BLOCK: Final[U64] = U64(199)",
                              "PER_BLOB: Final[U64] = U64(1)",
                              "BLOB_MIN_GASPRICE: Final[Uint] = Uint(2)",
                              "BLOB_BASE_FEE_UPDATE_FRACTION: Final[Uint] = Uint(750)",
                              "BLOB_SCHEDULE_TARGET: Final[U64] = U64(88)",
                              "BLOB_SCHEDULE_MAX: Final[U64] = U64(77)",
                          ]
                          for needle in expected:
                              assert needle in source

                      with (fork_dir / "fork.py").open("r") as f:
                          assert (
                              "MAX_BLOB_GAS_PER_BLOCK: Final[U64] = U64(99)"
                              in f.read()
                          )

                  template_has_trie = (template_path / "trie.py").exists()
                  if template_has_trie:
                      assert (fork_dir / "trie.py").exists()
                  else:
                      assert not (fork_dir / "trie.py").exists()


          def test_schedule_driven_template_rejects_legacy_blob_override() -> None:
              """Reject legacy blob knobs instead of silently changing aliases."""
              template_fork = Hardfork.discover()[-1].short_name
              template_path = Path("src/ethereum/forks") / template_fork
              if not (template_path / "slot_timing.py").exists():
                  pytest.skip("latest fork is not schedule-driven")

              with TemporaryDirectory() as base_dir:
                  with pytest.raises(ValueError, match="SLOT_DURATION_SCHEDULE"):
                      new_fork(
                          [
                              "--new-fork",
                              "e2e_fork",
                              "--template-fork",
                              template_fork,
                              "--blob-schedule-target",
                              "88",
                              "--output",
                              str(Path(base_dir) / "ethereum"),
                          ]
                      )
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          # Clarify that schedule epochs are consensus epochs; epoch zero is
          # an always-active sentinel for Amsterdam's initial 10-second era.
          path = Path("src/ethereum/forks/amsterdam/slot_timing.py")
          text = path.read_text()
          old = '''# The Amsterdam execution package is activated at the EIP-8198 fork boundary,
          # so epoch zero here is relative to the package's active era. The pre-Amsterdam
          # parent remains represented by BASE_SLOT_DURATION_MS. Future duration changes
          # are additional entries; protocol logic does not change.
          '''
          new = '''# The epoch-zero entry is an always-active initial Amsterdam duration when this
          # fork package executes. Additional entries use consensus epoch numbers derived
          # from Header.slot_number. A future duration change is therefore schedule data;
          # protocol logic does not change.
          '''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY

          uv run ruff check --fix \
            src/ethereum_spec_tools/forks.py \
            src/ethereum_spec_tools/new_fork/builder.py \
            tests/evm_tools/test_fork_cache.py \
            tests/evm_tools/test_new_fork.py \
            src/ethereum/forks/amsterdam/slot_timing.py
          uv run ruff format \
            src/ethereum_spec_tools/forks.py \
            src/ethereum_spec_tools/new_fork/builder.py \
            tests/evm_tools/test_fork_cache.py \
            tests/evm_tools/test_new_fork.py \
            src/ethereum/forks/amsterdam/slot_timing.py
          just static
          just spec-tools
          uv run pytest -q tests/amsterdam/eip8198_quick_slots

          git rm .github/workflows/eip8198-tooling-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ethereum_spec_tools/forks.py \
            src/ethereum_spec_tools/new_fork/builder.py \
            tests/evm_tools/test_fork_cache.py \
            tests/evm_tools/test_new_fork.py \
            src/ethereum/forks/amsterdam/slot_timing.py
          git commit -m "refactor(eip-8198): make fork tooling schedule-aware"
          git push origin HEAD:eip8198-slot-time-agnostic
