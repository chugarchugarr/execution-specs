name: EIP-8198 Tooling Closure

on:
  pull_request:

permissions:
  contents: write

jobs:
  closure:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: eip8198-slot-time-agnostic
      - uses: ./.github/actions/setup-uv
      - name: Make fork tooling schedule-aware and prove it
        shell: bash
        run: |
          python .github/eip8198_tooling_closure.py
          uv run ruff check --fix \
            src/ethereum_spec_tools/forks.py \
            src/ethereum_spec_tools/new_fork/builder.py \
            tests/evm_tools/test_fork_cache.py \
            tests/evm_tools/test_new_fork.py \
            src/ethereum/forks/amsterdam/slot_timing.py
          uv run ruff format \
            src/ethereum_spec_tools/forks.py \
            src/ethereum_spec_tools/new_fork/builder.py \
            tests/evm_tools/test_fork_cache.py \
            tests/evm_tools/test_new_fork.py \
            src/ethereum/forks/amsterdam/slot_timing.py
          just static
          just spec-tools
          uv run pytest -q tests/amsterdam/eip8198_quick_slots

          git rm \
            .github/workflows/eip8198-tooling-closure.yml \
            .github/eip8198_tooling_closure.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ethereum_spec_tools/forks.py \
            src/ethereum_spec_tools/new_fork/builder.py \
            tests/evm_tools/test_fork_cache.py \
            tests/evm_tools/test_new_fork.py \
            src/ethereum/forks/amsterdam/slot_timing.py
          git commit -m "refactor(eip-8198): make fork tooling schedule-aware"
          git push origin HEAD:eip8198-slot-time-agnostic
