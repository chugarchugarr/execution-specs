name: EIP-8198 upstream rebase diagnostic

on:
  push:
    branches:
      - ci/eip8198-upstream-rebase

permissions:
  contents: read

jobs:
  rebase-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: eip8198-slot-time-agnostic-review
          fetch-depth: 0
      - name: Configure rebase identity
        run: |
          git config user.name "chugarchugarr"
          git config user.email "josephlerma19@gmail.com"
      - name: Add upstream and fetch Amsterdam
        run: |
          git remote add upstream https://github.com/ethereum/execution-specs.git
          git fetch upstream forks/amsterdam
      - name: Rebase and resolve only the verified first conflict
        shell: bash
        run: |
          set +e
          git rebase upstream/forks/amsterdam
          rc=$?

          if [ "$rc" -ne 0 ] && [ "$(git diff --name-only --diff-filter=U)" = "src/ethereum/forks/amsterdam/fork.py" ]; then
            git checkout --conflict=diff3 -- src/ethereum/forks/amsterdam/fork.py
            python - <<'PY'
          from pathlib import Path
          p = Path('src/ethereum/forks/amsterdam/fork.py')
          s = p.read_text()
          old = '''<<<<<<< ours
          SYSTEM_TRANSACTION_GAS = ExecutionGas(Uint(30000000))
          ||||||| base
          SYSTEM_TRANSACTION_GAS = Uint(30000000)
          =======
          """
          Address of the beacon roots ring buffer contract. Its 8191-entry buffer
          holds one root per slot, so its wall-clock coverage shrinks from ~27.3
          hours to ~22.8 hours under 10-second slots. The buffer length is part of
          the deployed contract and is deliberately not changed by this fork.
          """
          SYSTEM_TRANSACTION_GAS = Uint(30000000)
          >>>>>>> theirs'''
          new = '''"""
          Address of the beacon roots ring buffer contract. Its 8191-entry buffer
          holds one root per slot, so its wall-clock coverage shrinks from ~27.3
          hours to ~22.8 hours under 10-second slots. The buffer length is part of
          the deployed contract and is deliberately not changed by this fork.
          """
          SYSTEM_TRANSACTION_GAS = ExecutionGas(Uint(30000000))'''
          if old not in s:
              raise SystemExit('verified conflict block not found exactly')
          p.write_text(s.replace(old, new, 1))
          PY
            if [ $? -ne 0 ]; then
              exit 2
            fi
            git add src/ethereum/forks/amsterdam/fork.py
            GIT_EDITOR=true git rebase --continue
            rc=$?
          fi

          echo "REBASE_EXIT=$rc"
          echo "--- STATUS ---"
          git status --short
          echo "--- UNMERGED PATHS ---"
          git diff --name-only --diff-filter=U
          if [ "$rc" -ne 0 ]; then
            for f in $(git diff --name-only --diff-filter=U); do
              echo "===== CONFLICT: $f ====="
              git checkout --conflict=diff3 -- "$f"
              sed -n '/<<<<<<< /,/>>>>>>> /p' "$f" || true
            done
            exit 1
          fi
