name: resolution-test-genesis-provider

on:
  push:
    branches:
      - test/genesis-provider-commitment

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/genesis-provider-commitment
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Refine provider-specific genesis regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/testing/src/execution_testing/cli/pytest_commands/plugins/execute/eth_config/tests/test_genesis.py")
          text = path.read_text()
          if "    Amsterdam,\n" not in text:
              text = text.replace(
                  "    BPO5,\n    Berlin,\n",
                  "    BPO5,\n    Amsterdam,\n    Berlin,\n",
                  1,
              )
          text = text.replace(
              "    alloc = Alloc({address: Account(balance=1, storage={0: 1})})\n    mpt_root = alloc.state_root()\n",
              "    alloc = Alloc({address: Account(balance=1, storage={0: 1})})\n    mpt_alloc = alloc.model_copy(deep=True)\n    mpt_alloc.migrate_state_commitment(Amsterdam.state_commitment())\n    mpt_root = mpt_alloc.state_root()\n",
              1,
          )
          text = text.replace(
              "    assert genesis.alloc.state_root() != mpt_root\n    assert genesis.hash == genesis.hash\n",
              "    assert genesis.alloc.state_root() != mpt_root\n    _ = genesis.hash\n",
              1,
          )
          path.write_text(text)
          PY
          git diff --check

      - name: Run focused regression and capture output
        shell: bash
        run: |
          set +e
          uv run pytest packages/testing/src/execution_testing/cli/pytest_commands/plugins/execute/eth_config/tests/test_genesis.py -q > .resolution-genesis-test.log 2>&1
          echo $? > .resolution-genesis-test.status
          cat .resolution-genesis-test.log
          exit 0

      - name: Commit diagnostic state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/testing/src/execution_testing/cli/pytest_commands/plugins/execute/eth_config/tests/test_genesis.py
          git add -f .resolution-genesis-test.log .resolution-genesis-test.status
          git commit -m "test(binary-trie): validate provider-aware genesis hashing"
          git push origin HEAD:test/genesis-provider-commitment
