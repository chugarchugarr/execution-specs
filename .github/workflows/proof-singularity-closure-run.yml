name: Proof Singularity closure run

on:
  push:
    branches:
      - lab/proof-singularity-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v4

      - name: Checkout current pinned leanVM
        uses: actions/checkout@v4
        with:
          repository: leanEthereum/leanVM
          ref: 2b7ca3b4f78f1e5020f9ebf2be2bf7981fb9a89f
          path: leanVM

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Proof Singularity probes into leanVM
        run: |
          mkdir -p leanVM/crates/rec_aggregation/examples
          cp proof_singularity_lab/ps_in_circuit_program_vk.rs leanVM/crates/rec_aggregation/examples/ps_in_circuit_program_vk.rs
          cp proof_singularity_lab/ps_arbitrary_verify_sub.rs leanVM/crates/rec_aggregation/examples/ps_arbitrary_verify_sub.rs
          python - <<'PY'
          from pathlib import Path
          p = Path('leanVM/crates/rec_aggregation/src/aggregation.rs')
          s = p.read_text()
          old = 'fn placeholder_map(kbc: usize) -> BTreeMap<String, String> {'
          helper = '''pub fn ps_gen_verify(
              program: &Program,
              public_input: [F192; 2],
              summary: lean_vm::cpu::VerifySummary,
          ) -> Result<(Vec<(&'static str, Vec<F192>)>, Vec<F192>, F192), AggregationError> {
              let (hints, deferred) = gen_verify(program, public_input, summary)?;
              let mut point = deferred.bytecode_row_point;
              point.extend(deferred.bytecode_selector_point);
              Ok((hints, point, deferred.bytecode_value))
          }

          pub fn placeholder_map(kbc: usize) -> BTreeMap<String, String> {'''
          assert old in s
          p.write_text(s.replace(old, helper, 1))

          p = Path('leanVM/crates/rec_aggregation/Cargo.toml')
          s = p.read_text()
          if 'fiat_shamir.workspace = true' not in s:
              s = s.replace('[dependencies]\n', '[dependencies]\nfiat_shamir.workspace = true\n', 1)
          p.write_text(s)

          p = Path('leanVM/crates/rec_aggregation/examples/ps_arbitrary_verify_sub.rs')
          s = p.read_text()
          old_prog = 'let mut inner = program("def main():\\n    x = 1\\n    x[1] = GEN\\n    x[GEN] = x[1] * GEN\\n    return\\n");'
          new_prog = 'let mut inner = program("def main():\\n    return\\n");'
          assert old_prog in s
          s = s.replace(old_prog, new_prog, 1)
          s = s.replace('let public = [F192::new(7, 0, 0), F192::new(11, 0, 0)];', 'let public = [F192::ZERO, F192::ZERO];', 1)
          p.write_text(s)
          PY

      - name: Prove standalone ProgramVK WHIR verifier in-circuit
        working-directory: leanVM
        env:
          ZK_ALLOC_POISON: "1"
        run: cargo run --release -p rec_aggregation --example ps_in_circuit_program_vk

      - name: Prove arbitrary verify_sub and close its exact deferred bytecode claim
        working-directory: leanVM
        env:
          ZK_ALLOC_POISON: "1"
        run: cargo run --release -p rec_aggregation --example ps_arbitrary_verify_sub
