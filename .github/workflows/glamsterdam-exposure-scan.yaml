name: Glamsterdam exposure scanner

on:
  push:
    branches:
      - "analysis/glamsterdam-mainnet-exposure"
  workflow_dispatch:

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.14"
      - name: Run scanner unit tests
        env:
          PYTHONPATH: .
        run: uv run pytest -q tests/tools/test_glamsterdam_exposure_scan.py
