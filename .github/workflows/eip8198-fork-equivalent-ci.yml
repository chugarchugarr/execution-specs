name: EIP-8198 schedule-driven exact-head proof

on:
  push:
    branches:
      - ci/eip8198-fork-equivalent-proof
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: ce754359c70bb3888ebacb3c97af95828d219e4e

jobs:
  provenance:
    name: Verify exact PR #4 head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify tested commit
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

  spec-tools:
    name: EIP-8198 fork-equivalent proof
    runs-on: ubuntu-latest
    needs: provenance
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.14"
      - name: Run repository spec-tools suite
        run: just spec-tools
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
      - name: Run relocated EIP-8198 proof suite
        run: >-
          cd packages/testing && uv run pytest -q
          src/execution_testing/evm_tools/tests/eip8198_quick_slots

  proof-green:
    name: Exact EIP-8198 proof green
    runs-on: ubuntu-latest
    if: always()
    needs:
      - provenance
      - spec-tools
    steps:
      - name: Require exact-head proof to pass
        env:
          PROVENANCE: ${{ needs.provenance.result }}
          SPEC_TOOLS: ${{ needs.spec-tools.result }}
        run: |
          printf '%s\n' \
            "provenance=$PROVENANCE" \
            "fork-equivalent=$SPEC_TOOLS"
          test "$PROVENANCE" = success
          test "$SPEC_TOOLS" = success
