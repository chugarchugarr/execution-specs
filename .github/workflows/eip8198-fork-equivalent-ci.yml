name: EIP-8198 10s-to-6s exact-head proof

on:
  push:
    branches:
      - ci/eip8198-fork-equivalent-proof
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: 577ff91d14e80b4289347db1eed64501841c8b02

jobs:
  provenance:
    name: Verify exact PR #4 head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify tested commit
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

  targeted-runtime:
    name: EIP-8198 10s-to-6s runtime proof
    runs-on: ubuntu-latest
    needs: provenance
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.14"
      - name: Run exact EIP-8198 composability suite
        run: uv run pytest -q tests/evm_tools/eip8198_quick_slots

  proof-green:
    name: Exact 10s-to-6s proof green
    runs-on: ubuntu-latest
    if: always()
    needs:
      - provenance
      - targeted-runtime
    steps:
      - name: Require exact-head proof to pass
        env:
          PROVENANCE: ${{ needs.provenance.result }}
          TARGETED_RUNTIME: ${{ needs.targeted-runtime.result }}
        run: |
          printf '%s\n' \
            "provenance=$PROVENANCE" \
            "targeted-runtime=$TARGETED_RUNTIME"
          test "$PROVENANCE" = success
          test "$TARGETED_RUNTIME" = success
