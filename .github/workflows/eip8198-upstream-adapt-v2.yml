name: EIP-8198 upstream adaptation v2

on:
  push:
    branches:
      - ci/eip8198-upstream-rebase

permissions:
  contents: write

jobs:
  adapt-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/eip8198-upstream-rebase
          fetch-depth: 0
      - name: Fetch protocol head and upstream
        run: |
          git config user.name "chugarchugarr"
          git config user.email "josephlerma19@gmail.com"
          cp scripts/eip8198_upstream_adapt.py /tmp/eip8198_upstream_adapt.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/eip8198_upstream_adapt.py')
          s = p.read_text()
          old = 'out, n = re.subn(pattern, replacement, source, count=1, flags=re.S)'
          new = 'out, n = re.subn(pattern, lambda _: replacement, source, count=1, flags=re.S)'
          if old not in s:
              raise SystemExit('literal replacement patch target missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git fetch origin eip8198-slot-time-agnostic-review
          git remote add upstream https://github.com/ethereum/execution-specs.git
          git fetch upstream forks/amsterdam
          echo "OLD_HEAD=$(git rev-parse origin/eip8198-slot-time-agnostic-review)" >> "$GITHUB_ENV"
          echo "UPSTREAM_HEAD=$(git rev-parse upstream/forks/amsterdam)" >> "$GITHUB_ENV"
      - name: Replay reference and adapt to current architecture
        run: |
          git checkout -B rebased-eip8198-ready upstream/forks/amsterdam
          set +e
          git cherry-pick 0e8cc7fa0c49f7abfddde9e1f14a40bc54fd407c
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            test "$(git diff --name-only --diff-filter=U)" = "src/ethereum/forks/amsterdam/fork.py"
            git checkout --conflict=diff3 -- src/ethereum/forks/amsterdam/fork.py
            python /tmp/eip8198_upstream_adapt.py --resolve-reference-conflict
            git add src/ethereum/forks/amsterdam/fork.py
            GIT_EDITOR=true git cherry-pick --continue
          fi
          python /tmp/eip8198_upstream_adapt.py "$OLD_HEAD"
          python - <<'PY'
          from pathlib import Path
          import re

          fork = Path('src/ethereum/forks/amsterdam/fork.py')
          s = fork.read_text()
          s = s.replace('    BLOB_GAS_PER_BLOB,\n', '', 1)
          s = s.replace('    get_blob_schedule,\n', '', 1)
          start = s.index('def get_max_blob_gas_per_block(')
          end = s.index('def calculate_base_fee_per_gas(', start)
          s = s[:start] + s[end:]
          fork.write_text(s)

          slot = Path('src/ethereum/forks/amsterdam/slot_timing.py')
          s = slot.read_text()
          anchor = '\ndef calculate_blob_gas_price_for_slot('
          helper = '''\ndef get_max_blob_gas_per_block(
              slot_number: U64,
              schedule: SlotDurationSchedule = SLOT_DURATION_SCHEDULE,
          ) -> U64:
              """Return blob gas capacity for the active duration era."""
              return BLOB_GAS_PER_BLOB * get_blob_schedule(slot_number, schedule).maximum

          '''
          if anchor not in s:
              raise SystemExit('slot timing helper anchor missing')
          s = s.replace(anchor, helper + anchor, 1)
          slot.write_text(s)

          gas = Path('src/ethereum/forks/amsterdam/vm/gas.py')
          s = gas.read_text()
          old = '    get_blob_schedule,\n)'
          new = '    get_blob_schedule,\n    get_max_blob_gas_per_block,\n)'
          if old not in s:
              raise SystemExit('gas slot timing import anchor missing')
          s = s.replace(old, new, 1)
          pattern = re.compile(
              r'    blob_gas_available = \(\n'
              r'\s*GasCosts\.PER_BLOB \* get_blob_schedule\(block_env\.slot_number\)\.maximum\n'
              r'\s*- block_output\.blob_gas_used\n'
              r'\s*\)'
          )
          replacement = '''    blob_gas_available = (
              get_max_blob_gas_per_block(block_env.slot_number)
              - block_output.blob_gas_used
          )'''
          s2, n = pattern.subn(lambda _: replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'expected one gas capacity expression, found {n}')
          gas.write_text(s2)

          test = Path('tests/evm_tools/eip8198_quick_slots/test_slot_timing.py')
          s = test.read_text()
          s = s.replace('    get_max_blob_gas_per_block,\n', '', 1)
          old = '    get_blob_schedule,\n'
          new = '    get_blob_schedule,\n    get_max_blob_gas_per_block,\n'
          if old not in s:
              raise SystemExit('test slot timing import anchor missing')
          test.write_text(s.replace(old, new, 1))
          PY
          git add src/ethereum/forks/amsterdam/fork.py \
            src/ethereum/forks/amsterdam/slot_timing.py \
            src/ethereum/forks/amsterdam/vm/gas.py \
            src/ethereum/forks/amsterdam/vm/instructions/environment.py \
            tests/evm_tools/eip8198_quick_slots
          git commit -m "feat(eip-8198): make slot-duration changes schedule-driven"
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.14"
      - name: Format only changed Python files
        run: |
          uv run ruff format src/ethereum/forks/amsterdam/fork.py \
            src/ethereum/forks/amsterdam/slot_timing.py \
            src/ethereum/forks/amsterdam/vm/gas.py \
            src/ethereum/forks/amsterdam/vm/instructions/environment.py \
            tests/evm_tools/eip8198_quick_slots
          if ! git diff --quiet; then
            git add src/ethereum/forks/amsterdam/fork.py \
              src/ethereum/forks/amsterdam/slot_timing.py \
              src/ethereum/forks/amsterdam/vm/gas.py \
              src/ethereum/forks/amsterdam/vm/instructions/environment.py \
              tests/evm_tools/eip8198_quick_slots
            git commit --amend --no-edit
          fi
      - name: Static / typecheck
        if: always()
        run: just typecheck
      - name: Static / lint-spec
        if: always()
        run: just lint-spec
      - name: Static / spellcheck
        if: always()
        run: just spellcheck
      - name: Static / deadcode
        if: always()
        run: just deadcode
      - name: Static / lint-actions
        if: always()
        run: just lint-actions
      - name: Static / lock-check
        if: always()
        run: just lock-check
      - name: Static / format-check
        if: always()
        run: just format-check
      - name: Static / lint
        if: always()
        run: just lint
      - name: Spec-tools validation
        run: just spec-tools
      - name: Focused EIP-8198 pytest
        run: uv run pytest -q tests/evm_tools/eip8198_quick_slots/test_additional_duration_era.py
      - name: Verify exact upstream merge base
        run: test "$(git merge-base HEAD upstream/forks/amsterdam)" = "$UPSTREAM_HEAD"
      - name: Verify clean diff
        run: git diff --check upstream/forks/amsterdam...HEAD
      - name: Record validated candidate
        run: echo "REBASING_RESULT=$(git rev-parse HEAD)"
      - name: Publish validated candidate
        run: git push --force origin HEAD:refs/heads/rebased/eip8198-upstream-ready
