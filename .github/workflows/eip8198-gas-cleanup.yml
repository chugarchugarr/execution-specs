name: EIP-8198 Gas Cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: eip8198-slot-time-agnostic
      - uses: ./.github/actions/setup-uv
      - name: Derive blob logic from slot schedule and prove it
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ethereum/forks/amsterdam/vm/gas.py")
          text = path.read_text()

          text = text.replace(
              "from ethereum.utils.numeric import ceil32, taylor_exponential",
              "from ethereum.utils.numeric import ceil32",
          )

          import_anchor = "from .exceptions import OutOfGasError"
          slot_import = '''from ..slot_timing import (
              BLOB_BASE_COST as SLOT_BLOB_BASE_COST,
              BLOB_GAS_PER_BLOB as SLOT_BLOB_GAS_PER_BLOB,
              BLOB_MIN_GASPRICE as SLOT_BLOB_MIN_GASPRICE,
              SLOT_DURATION_SCHEDULE,
              SlotDurationSchedule,
              calculate_blob_gas_price_for_slot,
              get_blob_schedule,
          )
          '''
          assert import_anchor in text
          text = text.replace(import_anchor, slot_import + import_anchor, 1)

          type_anchor = 'if TYPE_CHECKING:\n    from . import Evm\n'
          assert type_anchor in text
          text = text.replace(
              type_anchor,
              type_anchor
              + '\n\n_INITIAL_SLOT = U64(0)\n'
              + '_INITIAL_BLOB_SCHEDULE = get_blob_schedule(_INITIAL_SLOT)\n',
              1,
          )

          class_start = text.index("    # Blobs\n", text.index("class GasCosts:"))
          class_end = text.index("\n    # Block Access Lists", class_start)
          blob_constants = '''    # Blobs
              #
              # Slot-sensitive blob parameters come from SLOT_DURATION_SCHEDULE.
              # These names retain the initial Amsterdam values only as a
              # compatibility surface for callers that inspect GasCosts directly;
              # protocol calculations below resolve the schedule for their slot.
              PER_BLOB: Final[U64] = SLOT_BLOB_GAS_PER_BLOB
              BLOB_SCHEDULE_TARGET: Final[U64] = _INITIAL_BLOB_SCHEDULE.target
              BLOB_TARGET_GAS_PER_BLOCK: Final[U64] = (
                  PER_BLOB * BLOB_SCHEDULE_TARGET
              )
              BLOB_BASE_COST: Final[Uint] = SLOT_BLOB_BASE_COST
              BLOB_SCHEDULE_MAX: Final[U64] = _INITIAL_BLOB_SCHEDULE.maximum
              BLOB_MIN_GASPRICE: Final[Uint] = SLOT_BLOB_MIN_GASPRICE
              BLOB_BASE_FEE_UPDATE_FRACTION: Final[Uint] = (
                  _INITIAL_BLOB_SCHEDULE.update_fraction
              )
          '''
          text = text[:class_start] + blob_constants + text[class_end:]

          func_start = text.index("def calculate_excess_blob_gas(")
          func_end = text.index(
              "\n\n@final\n@dataclass\nclass ExecutionGasAllocation", func_start
          )
          functions = '''def calculate_excess_blob_gas(
              parent_header: Header | PreviousHeader,
              current_slot_number: U64 = _INITIAL_SLOT,
              slot_duration_schedule: SlotDurationSchedule = SLOT_DURATION_SCHEDULE,
          ) -> U64:
              """Calculate excess blob gas using the current duration era."""
              excess_blob_gas = U64(0)
              blob_gas_used = U64(0)
              base_fee_per_gas = Uint(0)

              if isinstance(parent_header, Header):
                  excess_blob_gas = parent_header.excess_blob_gas
                  blob_gas_used = parent_header.blob_gas_used
                  base_fee_per_gas = parent_header.base_fee_per_gas

              blob_schedule = get_blob_schedule(
                  current_slot_number, slot_duration_schedule
              )
              target_blob_gas_per_block = GasCosts.PER_BLOB * blob_schedule.target
              parent_blob_gas = excess_blob_gas + blob_gas_used
              if parent_blob_gas < target_blob_gas_per_block:
                  return U64(0)

              target_blob_gas_price = Uint(GasCosts.PER_BLOB)
              target_blob_gas_price *= calculate_blob_gas_price(
                  excess_blob_gas,
                  current_slot_number,
                  slot_duration_schedule,
              )

              base_blob_tx_price = GasCosts.BLOB_BASE_COST * base_fee_per_gas
              if base_blob_tx_price > target_blob_gas_price:
                  blob_schedule_delta = blob_schedule.maximum - blob_schedule.target
                  return U64(
                      excess_blob_gas
                      + blob_gas_used * blob_schedule_delta // blob_schedule.maximum
                  )

              return U64(parent_blob_gas - target_blob_gas_per_block)


          def calculate_total_blob_gas(tx: Transaction) -> U64:
              """Calculate the total blob gas for a transaction."""
              if isinstance(tx, BlobTransaction):
                  return GasCosts.PER_BLOB * U64(len(tx.blob_versioned_hashes))
              return U64(0)


          def calculate_blob_gas_price(
              excess_blob_gas: U64,
              slot_number: U64 = _INITIAL_SLOT,
              slot_duration_schedule: SlotDurationSchedule = SLOT_DURATION_SCHEDULE,
          ) -> Uint:
              """Calculate the blob gas price for the supplied duration era."""
              return calculate_blob_gas_price_for_slot(
                  excess_blob_gas,
                  slot_number,
                  slot_duration_schedule,
              )


          def calculate_data_fee(
              excess_blob_gas: U64,
              tx: Transaction,
              slot_number: U64 = _INITIAL_SLOT,
              slot_duration_schedule: SlotDurationSchedule = SLOT_DURATION_SCHEDULE,
          ) -> Uint:
              """Calculate the blob data fee for the supplied duration era."""
              return Uint(calculate_total_blob_gas(tx)) * calculate_blob_gas_price(
                  excess_blob_gas,
                  slot_number,
                  slot_duration_schedule,
              )
          '''
          text = text[:func_start] + functions + text[func_end:]
          path.write_text(text)
          PY

          uv run ruff check --fix src/ethereum/forks/amsterdam/vm/gas.py
          uv run ruff format src/ethereum/forks/amsterdam/vm/gas.py
          uv run ruff check src/ethereum/forks/amsterdam/vm/gas.py
          just static
          uv run pytest -q tests/amsterdam/eip8198_quick_slots/test_slot_timing.py

          git rm .github/workflows/eip8198-gas-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ethereum/forks/amsterdam/vm/gas.py
          git commit -m "refactor(eip-8198): derive blob gas helpers from slot schedule"
          git push origin HEAD:eip8198-slot-time-agnostic
